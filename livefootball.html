<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Live Football</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

header img{
width:35px;
height:35px;
}

.matches{
max-width:900px;
margin:auto;
padding:20px;
}

.match{
background:#1f2937;
margin-bottom:10px;
padding:15px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.match button{
background:#2563eb;
border:none;
padding:8px 15px;
color:white;
border-radius:6px;
cursor:pointer;
}

.player{
max-width:1000px;
margin:20px auto;
padding:20px;
}

iframe{
width:100%;
height:500px;
border:none;
border-radius:10px;
background:black;
}

.warning{
text-align:center;
color:#cbd5e1;
font-size:14px;
}

</style>

</head>

<body>

<header>
<img src="https://cdn-icons-png.flaticon.com/512/53/53283.png">
Live Football Matches
</header>

<div class="matches">

<div class="match">
<span>Manchester United vs Arsenal</span>
<button onclick="playMatch('STREAM_LINK_1')">Watch</button>
</div>

<div class="match">
<span>Barcelona vs Real Madrid</span>
<button onclick="playMatch('STREAM_LINK_2')">Watch</button>
</div>

<div class="match">
<span>Liverpool vs Chelsea</span>
<button onclick="playMatch('STREAM_LINK_3')">Watch</button>
</div>

</div>

<div class="player">

<iframe id="player" allowfullscreen></iframe>

<p class="warning">
⚠ If the stream doesn't load, refresh the page.
</p>

</div>

<script>

function playMatch(link){

document.getElementById("player").src = link;

window.scrollTo({top:400,behavior:"smooth"});

}

</script>

</body>
</html>
