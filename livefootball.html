<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Live Football</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

header{
background:#111827;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.back{
position:absolute;
left:15px;
top:18px;
background:#2563eb;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
color:white;
font-size:13px;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.league{
margin-top:25px;
}

.league h2{
border-bottom:2px solid #374151;
padding-bottom:6px;
font-size:18px;
}

.match{
background:#1f2937;
margin-top:10px;
padding:12px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.match button{
background:#2563eb;
border:none;
padding:6px 12px;
color:white;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

.live{
color:#ef4444;
font-weight:bold;
margin-right:8px;
}

.player{
margin-top:30px;
}

.servers{
text-align:center;
margin-bottom:8px;
}

.servers button{
margin:3px;
padding:6px 10px;
border:none;
border-radius:6px;
background:#374151;
color:white;
cursor:pointer;
font-size:13px;
}

.servers button:hover{
background:#2563eb;
}

iframe{
width:100%;
height:420px;
border:none;
border-radius:10px;
background:black;
}

.warning{
text-align:center;
font-size:13px;
color:#cbd5e1;
margin-top:5px;
}

/* mobile layout */

@media(max-width:600px){

header{
font-size:18px;
}

.match{
flex-direction:column;
align-items:flex-start;
gap:8px;
}

.match button{
width:100%;
}

iframe{
height:260px;
}

}

</style>
</head>

<body>

<a class="back" href="index.html">⬅ Home</a>

<header>
⚽ Live Football
</header>

<div class="container">

<!-- Premier League -->

<div class="league">
<h2>🏆 Premier League</h2>

<div class="match">
<span><span class="live">🔴 LIVE</span>Manchester United vs Arsenal</span>
<button onclick="loadMatch('STREAM1','STREAM2','STREAM3')">Watch</button>
</div>

<div class="match">
<span>Liverpool vs Chelsea</span>
<button onclick="loadMatch('STREAM4','STREAM5','STREAM6')">Watch</button>
</div>

</div>

<!-- La Liga -->

<div class="league">
<h2>🇪🇸 La Liga</h2>

<div class="match">
<span>Barcelona vs Real Madrid</span>
<button onclick="loadMatch('STREAM7','STREAM8','STREAM9')">Watch</button>
</div>

</div>

<!-- Champions League -->

<div class="league">
<h2>⭐ Champions League</h2>

<div class="match">
<span>PSG vs Bayern Munich</span>
<button onclick="loadMatch('STREAM10','STREAM11','STREAM12')">Watch</button>
</div>

</div>

<!-- Player -->

<div class="player">

<div class="servers">
<button onclick="setServer(0)">Server 1</button>
<button onclick="setServer(1)">Server 2</button>
<button onclick="setServer(2)">Server 3</button>
</div>

<iframe id="player" allowfullscreen></iframe>

<p class="warning">
⚠ If stream doesn't start switch server.
</p>

</div>

</div>

<script>

let streams=[];

function loadMatch(s1,s2,s3){

streams=[s1,s2,s3];

document.getElementById("player").src=s1;

window.scrollTo({top:500,behavior:"smooth"});

}

function setServer(index){

if(streams[index]){
document.getElementById("player").src=streams[index];
}

}

</script>

</body>
</html>
