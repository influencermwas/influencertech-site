<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Live Football</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

header{
background:#111827;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.back{
position:absolute;
left:15px;
top:18px;
background:#2563eb;
padding:6px 10px;
border-radius:6px;
text-decoration:none;
color:white;
font-size:13px;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.match{
background:#1f2937;
margin-top:10px;
padding:12px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.match button{
background:#2563eb;
border:none;
padding:6px 12px;
color:white;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

.league{
font-size:14px;
color:#cbd5e1;
}

.player{
margin-top:25px;
}

iframe{
width:100%;
height:420px;
border:none;
border-radius:10px;
background:black;
}

.warning{
text-align:center;
font-size:13px;
color:#cbd5e1;
margin-top:5px;
}

.empty{
text-align:center;
margin-top:40px;
color:#9ca3af;
}

@media(max-width:600px){

.match{
flex-direction:column;
align-items:flex-start;
gap:8px;
}

.match button{
width:100%;
}

iframe{
height:250px;
}

}

</style>
</head>

<body>

<a class="back" href="index.html">⬅ Home</a>

<header>
⚽ Live Football Matches
</header>

<div class="container">

<div id="matches"></div>

<div class="player">

<iframe id="player" allowfullscreen></iframe>

<p class="warning">
⚠ If stream doesn't load refresh the page.
</p>

</div>

</div>

<script>

function loadMatches(){

let matches = JSON.parse(localStorage.getItem("matches") || "[]");

let container = document.getElementById("matches");

container.innerHTML="";

if(matches.length === 0){

container.innerHTML="<div class='empty'>No matches scheduled</div>";
return;

}

matches.forEach(m=>{

let div=document.createElement("div");

div.className="match";

div.innerHTML=`
<div>
<div class="league">${m.league}</div>
<div>${m.teams} (${m.time})</div>
</div>
<button onclick="watch('${m.stream}')">Watch</button>
`;

container.appendChild(div);

});

}

function watch(link){

document.getElementById("player").src = link;

window.scrollTo({
top:500,
behavior:"smooth"
});

}

loadMatches();

</script>

</body>
</html>
