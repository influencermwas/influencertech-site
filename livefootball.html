<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Live Football</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.back{
position:absolute;
left:20px;
top:20px;
background:#2563eb;
padding:8px 12px;
border-radius:6px;
text-decoration:none;
color:white;
font-size:14px;
}

.matches{
max-width:900px;
margin:auto;
padding:20px;
}

.match{
background:#1f2937;
margin-bottom:12px;
padding:15px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.live{
color:red;
font-weight:bold;
margin-right:10px;
}

.match button{
background:#2563eb;
border:none;
padding:8px 15px;
color:white;
border-radius:6px;
cursor:pointer;
}

.player{
max-width:1000px;
margin:20px auto;
padding:20px;
}

.servers{
text-align:center;
margin-bottom:10px;
}

.servers button{
margin:5px;
padding:8px 14px;
border:none;
border-radius:6px;
background:#374151;
color:white;
cursor:pointer;
}

.servers button:hover{
background:#2563eb;
}

iframe{
width:100%;
height:500px;
border:none;
border-radius:10px;
background:black;
}

.warning{
text-align:center;
color:#cbd5e1;
font-size:14px;
}

</style>

</head>

<body>

<a class="back" href="index.html">⬅ Home</a>

<header>
⚽ Live Football Matches
</header>

<div class="matches">

<div class="match">
<span><span class="live">🔴 LIVE</span>Manchester United vs Arsenal</span>
<button onclick="loadMatch('STREAM1','STREAM2','STREAM3')">Watch</button>
</div>

<div class="match">
<span>Barcelona vs Real Madrid</span>
<button onclick="loadMatch('STREAM4','STREAM5','STREAM6')">Watch</button>
</div>

<div class="match">
<span>Liverpool vs Chelsea</span>
<button onclick="loadMatch('STREAM7','STREAM8','STREAM9')">Watch</button>
</div>

</div>

<div class="player">

<div class="servers">
<button onclick="setServer(0)">Server 1</button>
<button onclick="setServer(1)">Server 2</button>
<button onclick="setServer(2)">Server 3</button>
</div>

<iframe id="player" allowfullscreen></iframe>

<p class="warning">
⚠ If stream doesn't start, switch server.
</p>

</div>

<script>

let streams=[];

function loadMatch(s1,s2,s3){

streams=[s1,s2,s3];

document.getElementById("player").src=s1;

window.scrollTo({top:500,behavior:"smooth"});

}

function setServer(index){

if(streams[index]){
document.getElementById("player").src=streams[index];
}

}

</script>

</body>
</html>
