<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body{
font-family:Arial;
background:#0f2027;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111827;
padding:30px;
border-radius:10px;
text-align:center;
width:320px;
}

input{
padding:10px;
margin-top:10px;
width:80%;
border-radius:5px;
border:none;
}

button{
padding:10px 20px;
margin-top:15px;
background:#22c55e;
border:none;
border-radius:5px;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Admin Panel</h2>

<label>Set Rate (%)</label>

<input type="number" id="rate" placeholder="Example: 90">

<br>

<button onclick="saveRate()">Save Rate</button>

<p id="status"></p>

</div>

<script>

function saveRate(){

let rate = document.getElementById("rate").value

if(rate < 80 || rate > 100){
alert("Enter valid rate")
return
}

localStorage.setItem("airtime_rate",rate)

document.getElementById("status").innerText="Rate updated to "+rate+"%"

}

</script>

</body>
</html>
