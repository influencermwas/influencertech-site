<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body{
font-family:Arial;
background:#0f2027;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111827;
padding:30px;
border-radius:10px;
text-align:center;
width:320px;
}

input{
padding:10px;
margin-top:10px;
width:80%;
border-radius:5px;
border:none;
}

button{
padding:10px 20px;
margin-top:15px;
background:#22c55e;
border:none;
border-radius:5px;
color:white;
cursor:pointer;
}

#panel{
display:none;
}
</style>

</head>

<body>

<div class="box">

<div id="login">

<h2>Admin Login</h2>

<input type="password" id="password" placeholder="Enter password">

<br>

<button onclick="login()">Login</button>

<p id="error"></p>

</div>

<div id="panel">

<h2>Admin Panel</h2>

<label>Set Rate (%)</label>

<input type="number" id="rate" placeholder="Example: 90">

<br>

<button onclick="saveRate()">Save Rate</button>

<p id="status"></p>

</div>

</div>

<script>

const adminPassword = "Brian4503"

function login(){

let pass = document.getElementById("password").value

if(pass === adminPassword){

document.getElementById("login").style.display="none"
document.getElementById("panel").style.display="block"

}else{

document.getElementById("error").innerText="Wrong password"

}

}

function saveRate(){

let rate = document.getElementById("rate").value

if(rate < 80 || rate > 100){
alert("Enter valid rate")
return
}

localStorage.setItem("airtime_rate",rate)

document.getElementById("status").innerText="Rate updated to "+rate+"%"

}

</script>

</body>
</html>
