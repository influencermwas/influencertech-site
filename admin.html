<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body{
font-family:Arial;
background:#0f2027;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111827;
padding:30px;
border-radius:10px;
text-align:center;
width:320px;
}

input{
padding:10px;
margin-top:10px;
width:80%;
border-radius:5px;
border:none;
}

button{
padding:10px 20px;
margin-top:15px;
background:#22c55e;
border:none;
border-radius:5px;
color:white;
cursor:pointer;
}

#panel{
display:none;
}
</style>

</head>

<body>

<div class="box">

<div id="login">

<h2>Admin Login</h2>

<input type="password" id="password" placeholder="Enter password">

<br>

<button onclick="login()">Login</button>

<p id="error"></p>

</div>

<div id="panel">

<h2>Admin Panel</h2>

<label>Set Rate (%)</label>
<input type="number" id="rate">

<br><br>

<label>Available Airtime</label>
<input type="number" id="stock">

<br>

<button onclick="saveSettings()">Save Settings</button>

<p id="status"></p>

</div>

</div>

<script>

const adminPassword = "Brian4503"

function login(){

let pass = document.getElementById("password").value

if(pass === adminPassword){

document.getElementById("login").style.display="none"
document.getElementById("panel").style.display="block"

}else{

document.getElementById("error").innerText="Wrong password"

}

}

function saveSettings(){

let rate = document.getElementById("rate").value
let stock = document.getElementById("stock").value

fetch("update-settings.php",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
rate:rate,
stock:stock
})
})
.then(res=>res.text())
.then(data=>{
document.getElementById("status").innerText="Settings updated"
})

}

</script>

</body>
</html>
