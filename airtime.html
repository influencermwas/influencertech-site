<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Airtime Order</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#020617;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
max-width:500px;
margin:40px auto;
background:#1f2937;
padding:25px;
border-radius:10px;
}

.balance{
background:#111827;
padding:10px;
border-radius:6px;
margin-bottom:20px;
text-align:center;
font-weight:bold;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
margin-top:15px;
padding:12px;
width:100%;
background:#9333ea;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:18px;
color:#22c55e;
}

.out{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<header>
Buy & Sell Airtime
</header>

<div class="container">

<div class="balance" id="balance">
Available Balance: 100000
</div>

<label>Enter Airtime Amount</label>
<input type="number" id="amount" placeholder="Enter airtime amount">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

let availableBalance = 100000;
let buyRate = 0.8;
let sellRate = 0.9;

function calculate(){

let amount = document.getElementById("amount").value;

if(amount==""){
alert("Enter amount");
return;
}

if(amount > availableBalance){

document.getElementById("result").innerHTML =
"<span class='out'>Out of Stock</span>";

return;

}

let buy = amount * buyRate;
let sell = amount * sellRate;

document.getElementById("result").innerHTML =
"You Receive (80%): "+buy+"<br>Sell Value (90%): "+sell;

}

</script>

</body>
</html>
