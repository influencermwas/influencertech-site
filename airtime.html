<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Airtime Order</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#020617;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
max-width:500px;
margin:40px auto;
background:#1f2937;
padding:25px;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
margin-top:15px;
padding:12px;
width:100%;
background:#9333ea;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:18px;
color:#22c55e;
}

</style>

</head>

<body>

<header>
Buy & Sell Airtime
</header>

<div class="container">

<label>Airtime Amount</label>
<input type="number" id="amount" placeholder="Enter airtime amount">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculate(){

let amount=document.getElementById("amount").value;

if(amount==""){
alert("Enter amount");
return;
}

let buy=amount*0.8;
let sell=amount*0.9;

document.getElementById("result").innerHTML=
"You Receive (80%): "+buy+"<br>Sell Value (90%): "+sell;

}

</script>

</body>
</html>
