<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Buy & Sell Airtime</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#020617;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:500px;
margin:40px auto;
background:#1f2937;
padding:25px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.4);
}

.balance{
background:#111827;
padding:12px;
border-radius:8px;
margin-bottom:20px;
text-align:center;
font-size:18px;
font-weight:bold;
}

label{
display:block;
margin-top:10px;
}

input{
width:100%;
padding:12px;
margin-top:5px;
border:none;
border-radius:6px;
font-size:16px;
}

button{
margin-top:20px;
padding:14px;
width:100%;
background:#9333ea;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#7e22ce;
}

.result{
margin-top:20px;
font-size:18px;
text-align:center;
color:#22c55e;
}

.out{
color:red;
font-weight:bold;
font-size:20px;
}

.info{
margin-top:15px;
font-size:14px;
text-align:center;
color:#cbd5e1;
}

</style>

</head>

<body>

<header>
Buy & Sell Airtime
</header>

<div class="container">

<div class="balance" id="balance">
Available Balance: KES 100000
</div>

<label>Enter Airtime Amount</label>
<input type="number" id="amount" placeholder="Enter airtime amount">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

<div class="info">
Buying Rate: 80% | Selling Rate: 90%
</div>

</div>

<script>

/* SETTINGS */

let availableBalance = 100000;
let buyRate = 0.8;
let sellRate = 0.9;

/* UPDATE BALANCE DISPLAY */

document.getElementById("balance").innerHTML =
"Available Balance: KES " + availableBalance;

/* CALCULATION FUNCTION */

function calculate(){

let amount = document.getElementById("amount").value;

if(amount == ""){
alert("Please enter airtime amount");
return;
}

amount = Number(amount);

if(amount > availableBalance){

document.getElementById("result").innerHTML =
"<span class='out'>Out of Stock</span>";

return;

}

let buyAmount = amount * buyRate;
let sellAmount = amount * sellRate;

document.getElementById("result").innerHTML =
"You Receive (80%): KES " + buyAmount +
"<br>Sell Value (90%): KES " + sellAmount;

}

</script>

</body>
</html>
