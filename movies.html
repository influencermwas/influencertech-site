<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Movies & Series</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.marquee-bar{
background:#1f2937;
color:white;
padding:10px;
font-size:14px;
font-weight:bold;
text-align:center;
border-bottom:1px solid #374151;
}

/* FEATURED MOVIE */
.featured{
max-width:1200px;
margin:20px auto;
display:flex;
background:#020617;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.featured img{
width:200px;
object-fit:cover;
}

.featured-info{
padding:20px;
}

.featured-info h2{
margin:0 0 10px 0;
}

.featured-info button{
padding:10px 16px;
background:#2563eb;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.search-box{
display:flex;
justify-content:center;
gap:10px;
margin:20px;
flex-wrap:wrap;
}

.search-box input{
padding:12px;
width:60%;
max-width:400px;
border-radius:6px;
border:none;
}

.search-box button{
padding:12px 20px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

.categories{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
}

.categories button{
padding:8px 15px;
border:none;
border-radius:20px;
background:#374151;
color:white;
cursor:pointer;
font-weight:bold;
}

.categories button:hover{
background:#2563eb;
}

.section-title{
text-align:center;
font-size:22px;
margin-top:10px;
}

.player{
max-width:1000px;
margin:20px auto;
padding:20px;
background:#020617;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

iframe{
width:100%;
height:500px;
border:none;
border-radius:10px;
background:#000;
}

.servers{
text-align:center;
margin-bottom:10px;
}

.server-btn{
margin:5px;
padding:10px 16px;
border:none;
border-radius:20px;
background:#1f2937;
color:white;
cursor:pointer;
font-weight:bold;
}

.server-btn.active{
background:#2563eb;
}

.player-warning{
text-align:center;
color:#cbd5e1;
font-size:13px;
margin:8px 0 14px 0;
}

.movies{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;
padding:20px;
max-width:1200px;
margin:auto;
}

.movie{
background:#1f2937;
border-radius:8px;
overflow:hidden;
cursor:pointer;
}

.movie img{
width:100%;
display:block;
}

.movie h4{
padding:6px;
font-size:14px;
text-align:center;
margin:0;
}

.movie small{
display:block;
text-align:center;
padding-bottom:8px;
color:#cbd5e1;
}

.episode-controls{
text-align:center;
margin-bottom:15px;
}

.episode-controls input{
width:60px;
padding:5px;
border-radius:4px;
border:none;
margin:0 5px;
}

.episode-controls button{
padding:6px 12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
margin:3px;
}

</style>
</head>

<body>

<header>
🎬 Movies & Series
</header>

<div class="marquee-bar">
<marquee>
🎬 Welcome to Movies & Series • ⚠ If ads appear close them and press play again • Switch servers if needed
</marquee>
</div>

<!-- FEATURED MOVIE -->
<div class="featured" id="featuredMovie">
<img id="featuredPoster">
<div class="featured-info">
<h2 id="featuredTitle"></h2>
<p id="featuredOverview"></p>
<button onclick="playFeatured()">▶ Watch Now</button>
</div>
</div>

<div class="search-box">
<input id="searchInput" placeholder="Search movies or series...">
<button onclick="searchMovie()">Search</button>
</div>

<div class="categories">
<button onclick="loadTrending()">Trending</button>
<button onclick="loadPopular()">Popular</button>
<button onclick="loadTopRated()">Top Rated</button>
<button onclick="loadCategory(28)">Action</button>
<button onclick="loadCategory(35)">Comedy</button>
<button onclick="loadCategory(27)">Horror</button>
<button onclick="loadTV()">TV Series</button>
</div>

<h2 class="section-title">Resume Watching</h2>
<div class="movies" id="continueWatching"></div>

<div class="player">

<div class="servers">
<button class="server-btn active" onclick="setServer(1,this)">Server 1</button>
<button class="server-btn" onclick="setServer(2,this)">Server 2</button>
</div>

<p class="player-warning">
⚠ If popup appears close it and press play again.
</p>

<div class="episode-controls" id="episodeControls">
Season <input id="season" type="number" value="1">
Episode <input id="episode" type="number" value="1">
<button onclick="loadEpisode()">Play Episode</button>
<button onclick="nextEpisode()">Next ▶</button>
</div>

<iframe id="player"
src="https://vidsrc.to/embed/movie/385687"
allowfullscreen></iframe>

</div>

<div class="movies" id="movies"></div>

<script>

const API_KEY="bf8178bc38b14afd2dbe7f66faa43ee5";

let currentMovieType="movie";
let currentMovieID="385687";
let currentServer=1;

/* FEATURED MOVIE */

async function loadFeatured(){

let res=await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`);

let data=await res.json();

let movie=data.results[0];

document.getElementById("featuredPoster").src="https://image.tmdb.org/t/p/w500"+movie.poster_path;

document.getElementById("featuredTitle").innerText=movie.title;

document.getElementById("featuredOverview").innerText=movie.overview;

window.featuredID=movie.id;

}

function playFeatured(){

currentMovieType="movie";
currentMovieID=featuredID;

updatePlayer();

window.scrollTo({top:0,behavior:"smooth"});

}

/* PLAYER */

function updatePlayer(){

let url="";

if(currentServer===1){
url=currentMovieType==="movie"
?`https://vidsrc.to/embed/movie/${currentMovieID}`
:`https://vidsrc.to/embed/tv/${currentMovieID}`;
}

if(currentServer===2){
url=currentMovieType==="movie"
?`https://vidsrc.me/embed/movie/${currentMovieID}`
:`https://vidsrc.me/embed/tv/${currentMovieID}`;
}

document.getElementById("player").src=url;

}

function setServer(server,btn){

currentServer=server;

document.querySelectorAll(".server-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

updatePlayer();

}

/* EPISODES */

function loadEpisode(){

let season=document.getElementById("season").value;
let episode=document.getElementById("episode").value;

let url=`https://vidsrc.to/embed/tv/${currentMovieID}/${season}/${episode}`;

document.getElementById("player").src=url;

}

function nextEpisode(){

let ep=document.getElementById("episode");

ep.value=parseInt(ep.value)+1;

loadEpisode();

}

/* PLAY MOVIE */

function playMovie(type,id,title,poster){

currentMovieType=type;
currentMovieID=id;

updatePlayer();

if(type==="movie"){
document.getElementById("episodeControls").style.display="none";
}else{
document.getElementById("episodeControls").style.display="block";
}

}

/* MOVIE GRID */

function displayMovies(movies){

let container=document.getElementById("movies");

container.innerHTML="";

movies.forEach(movie=>{

if(!movie.poster_path) return;

let title=movie.title || movie.name;
let poster="https://image.tmdb.org/t/p/w500"+movie.poster_path;
let rating=movie.vote_average.toFixed(1);
let year=(movie.release_date || movie.first_air_date || "").slice(0,4);

let id=movie.id;
let type=movie.media_type || (movie.first_air_date ? "tv":"movie");

let div=document.createElement("div");

div.className="movie";

div.innerHTML=`
<img src="${poster}">
<h4>${title}</h4>
<small>⭐ ${rating} • ${year}</small>
`;

div.onclick=()=>playMovie(type,id,title,poster);

container.appendChild(div);

});

}

/* API */

async function loadTrending(){

let res=await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}`);
let data=await res.json();

displayMovies(data.results);

}

async function loadPopular(){

let res=await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`);
let data=await res.json();

displayMovies(data.results);

}

async function loadTopRated(){

let res=await fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}`);
let data=await res.json();

displayMovies(data.results);

}

async function loadCategory(id){

let res=await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${id}`);
let data=await res.json();

displayMovies(data.results);

}

async function loadTV(){

let res=await fetch(`https://api.themoviedb.org/3/trending/tv/week?api_key=${API_KEY}`);
let data=await res.json();

displayMovies(data.results);

}

async function searchMovie(){

let query=document.getElementById("searchInput").value;

if(query.length<2) return;

let res=await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${query}`);
let data=await res.json();

displayMovies(data.results);

}

loadTrending();
loadFeatured();

</script>

</body>
</html>
