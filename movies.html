<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Movies & Series</title>

<style>

body{
font-family:Arial;
margin:0;
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:22px;
}

.search{
text-align:center;
margin:20px;
}

input{
padding:12px;
width:60%;
max-width:400px;
border-radius:6px;
border:none;
}

.player{
max-width:1000px;
margin:auto;
padding:20px;
}

iframe{
width:100%;
height:500px;
border:none;
border-radius:10px;
}

.movies{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;
padding:20px;
max-width:1200px;
margin:auto;
}

.movie{
background:#1f2937;
border-radius:8px;
overflow:hidden;
cursor:pointer;
}

.movie img{
width:100%;
}

.movie h4{
padding:10px;
font-size:14px;
}

</style>

</head>

<body>

<header>
🎬 Movies & Series
</header>

<div class="search">

<input id="search" placeholder="Search movies or series...">

</div>

<div class="player">

<iframe id="player"
src="https://vidsrc.to/embed/movie/tt4154796"
allowfullscreen></iframe>

</div>

<div class="movies" id="movies"></div>

<script>

const API_KEY="PUT_YOUR_TMDB_API_KEY_HERE";

async function loadTrending(){

let res = await fetch(
`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}`
);

let data = await res.json();

displayMovies(data.results);

}

function displayMovies(movies){

let container=document.getElementById("movies");

container.innerHTML="";

movies.forEach(movie=>{

let title = movie.title || movie.name;

let poster = "https://image.tmdb.org/t/p/w500"+movie.poster_path;

let imdb = movie.id;

let type = movie.media_type || "movie";

let div=document.createElement("div");

div.className="movie";

div.innerHTML=`

<img src="${poster}">
<h4>${title}</h4>

`;

div.onclick=()=>playMovie(type,imdb);

container.appendChild(div);

});

}

function playMovie(type,id){

let url="";

if(type==="movie"){
url=`https://vidsrc.to/embed/movie/${id}`;
}else{
url=`https://vidsrc.to/embed/tv/${id}`;
}

document.getElementById("player").src=url;

window.scrollTo(0,0);

}

document.getElementById("search").addEventListener("keyup", async function(){

let query=this.value;

if(query.length<3) return;

let res=await fetch(
`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${query}`
);

let data=await res.json();

displayMovies(data.results);

});

loadTrending();

</script>

</body>
</html>
