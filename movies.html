<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movies & Series</title>

<style>

body{
font-family:Arial;
margin:0;
background:#0f172a;
color:white;
text-align:center;
}

header{
background:#111827;
padding:20px;
font-size:24px;
font-weight:bold;
}

.player{
max-width:900px;
margin:30px auto;
padding:20px;
}

video{
width:100%;
border-radius:10px;
}

.movies{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
max-width:1000px;
margin:auto;
}

.movie{
background:#1f2937;
padding:10px;
border-radius:10px;
}

.movie img{
width:100%;
border-radius:10px;
}

button{
margin-top:10px;
padding:10px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

</style>
</head>

<body>

<header>🎬 Movies & Series</header>

<div class="player">
<video id="moviePlayer" controls>
<source src="movie1.mp4" type="video/mp4">
Your browser does not support video.
</video>
</div>

<div class="movies">

<div class="movie">
<img src="https://via.placeholder.com/200x300">
<h3>Movie 1</h3>
<button onclick="playMovie('movie1.mp4')">Watch</button>
</div>

<div class="movie">
<img src="https://via.placeholder.com/200x300">
<h3>Movie 2</h3>
<button onclick="playMovie('movie2.mp4')">Watch</button>
</div>

<div class="movie">
<img src="https://via.placeholder.com/200x300">
<h3>Movie 3</h3>
<button onclick="playMovie('movie3.mp4')">Watch</button>
</div>

</div>

<script>

function playMovie(movie){
document.getElementById("moviePlayer").src = movie;
document.getElementById("moviePlayer").play();
}

</script>

</body>
</html>
