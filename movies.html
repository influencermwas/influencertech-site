<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Movies & Series</title>

<style>
body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.search-box{
display:flex;
justify-content:center;
gap:10px;
margin:20px;
flex-wrap:wrap;
}

.search-box input{
padding:12px;
width:60%;
max-width:400px;
border-radius:6px;
border:none;
}

.search-box button{
padding:12px 20px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

.categories{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
}

.categories button{
padding:8px 15px;
border:none;
border-radius:20px;
background:#374151;
color:white;
cursor:pointer;
font-weight:bold;
}

.categories button:hover,
.search-box button:hover,
.servers button:hover{
background:#1d4ed8;
}

.section-title{
text-align:center;
margin:10px 0 0 0;
font-size:22px;
font-weight:bold;
}

.player{
max-width:1000px;
margin:auto;
padding:20px;
}

iframe{
width:100%;
height:500px;
border:none;
border-radius:10px;
background:#000;
}

.servers{
text-align:center;
margin-bottom:15px;
}

.servers button{
margin:5px;
padding:10px 15px;
border:none;
border-radius:6px;
background:#374151;
color:white;
cursor:pointer;
}

.movies{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;
padding:20px;
max-width:1200px;
margin:auto;
}

.movie{
background:#1f2937;
border-radius:8px;
overflow:hidden;
cursor:pointer;
}

.movie img{
width:100%;
display:block;
}

.movie h4{
padding:10px;
font-size:14px;
text-align:center;
margin:0;
}

.empty-note{
text-align:center;
color:#cbd5e1;
padding:10px 20px 0 20px;
}

@media (max-width:768px){
iframe{
height:260px;
}
.search-box input{
width:90%;
}
}
</style>
</head>

<body>

<header>
🎬 Movies & Series
</header>

<div class="search-box">
<input id="searchInput" placeholder="Search movies or series...">
<button onclick="searchMovie()">Search</button>
</div>

<div class="categories">
<button onclick="loadTrending()">Trending</button>
<button onclick="loadPopular()">Popular</button>
<button onclick="loadTopRated()">Top Rated</button>
<button onclick="loadCategory(28)">Action</button>
<button onclick="loadCategory(35)">Comedy</button>
<button onclick="loadCategory(27)">Horror</button>
<button onclick="loadCategory(18)">Drama</button>
<button onclick="loadTV()">TV Series</button>
</div>

<h2 class="section-title">Resume Watching</h2>
<div id="continueMessage" class="empty-note">Movies you open will appear here.</div>
<div class="movies" id="continueWatching"></div>

<div class="player">
<div class="servers">
<button onclick="setServer(1)">Server 1</button>
<button onclick="setServer(2)">Server 2</button>
<button onclick="setServer(3)">Server 3</button>
</div>

<iframe id="player"
src="https://vidsrc.to/embed/movie/385687"
allowfullscreen>
</iframe>
</div>

<div class="movies" id="movies"></div>

<script>
const API_KEY="bf8178bc38b14afd2dbe7f66faa43ee5";

let currentMovieType="movie";
let currentMovieID="385687";
let currentServer=1;

function updatePlayer(){
let url="";

if(currentServer===1){
url=currentMovieType==="movie"
?`https://vidsrc.to/embed/movie/${currentMovieID}`
:`https://vidsrc.to/embed/tv/${currentMovieID}`;
}

if(currentServer===2){
url=currentMovieType==="movie"
?`https://vidsrc.me/embed/movie/${currentMovieID}`
:`https://vidsrc.me/embed/tv/${currentMovieID}`;
}

if(currentServer===3){
url=currentMovieType==="movie"
?`https://2embed.cc/embed/${currentMovieID}`
:`https://2embed.cc/embedtv/${currentMovieID}`;
}

document.getElementById("player").src=url;
}

function setServer(server){
currentServer=server;
updatePlayer();
}

function saveContinueWatching(id,type,title,poster){
let list = JSON.parse(localStorage.getItem("continueWatching")) || [];

list = list.filter(movie => !(String(movie.id)===String(id) && movie.type===type));

list.unshift({
id:String(id),
type:type,
title:title,
poster:poster
});

if(list.length>6){
list.pop();
}

localStorage.setItem("continueWatching",JSON.stringify(list));
loadContinueWatching();
}

function loadContinueWatching(){
let list = JSON.parse(localStorage.getItem("continueWatching")) || [];
let container = document.getElementById("continueWatching");
let msg = document.getElementById("continueMessage");

container.innerHTML="";

if(list.length===0){
msg.style.display="block";
return;
}

msg.style.display="none";

list.forEach(movie=>{
let div=document.createElement("div");
div.className="movie";
div.innerHTML=`
<img src="${movie.poster}" alt="${movie.title}">
<h4>${movie.title}</h4>
`;
div.onclick=()=>playMovie(movie.type,movie.id,movie.title,movie.poster);
container.appendChild(div);
});
}

function playMovie(type,id,title,poster){
currentMovieType=type;
currentMovieID=String(id);

updatePlayer();
saveContinueWatching(id,type,title,poster);

window.scrollTo({top:0,behavior:"smooth"});
}

async function loadTrending(){
let res=await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}`);
let data=await res.json();
displayMovies(data.results || []);
}

async function loadPopular(){
let res=await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`);
let data=await res.json();
displayMovies(data.results || []);
}

async function loadTopRated(){
let res=await fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}`);
let data=await res.json();
displayMovies(data.results || []);
}

async function loadCategory(id){
let res=await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${id}`);
let data=await res.json();
displayMovies(data.results || []);
}

async function loadTV(){
let res=await fetch(`https://api.themoviedb.org/3/trending/tv/week?api_key=${API_KEY}`);
let data=await res.json();
displayMovies(data.results || []);
}

function displayMovies(movies){
let container=document.getElementById("movies");
container.innerHTML="";

movies.forEach(movie=>{
if(!movie.poster_path) return;

let title=movie.title || movie.name;
let poster="https://image.tmdb.org/t/p/w500"+movie.poster_path;
let id=movie.id;
let type=movie.media_type || (movie.first_air_date ? "tv" : "movie");

let div=document.createElement("div");
div.className="movie";
div.innerHTML=`
<img src="${poster}" alt="${title}">
<h4>${title}</h4>
`;
div.onclick=()=>playMovie(type,id,title,poster);
container.appendChild(div);
});
}

async function searchMovie(){
let query=document.getElementById("searchInput").value.trim();
if(query.length<2) return;

let res=await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
let data=await res.json();
displayMovies(data.results || []);
}

loadTrending();
loadContinueWatching();
</script>

</body>
</html>
