<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Movies & Series</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.search-box{
display:flex;
justify-content:center;
gap:10px;
margin:20px;
}

.search-box input{
padding:12px;
width:60%;
max-width:400px;
border-radius:6px;
border:none;
}

.search-box button{
padding:12px 20px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

.search-box button:hover{
background:#1d4ed8;
}

.player{
max-width:1000px;
margin:auto;
padding:20px;
}

iframe{
width:100%;
height:500px;
border:none;
border-radius:10px;
}

.movies{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;
padding:20px;
max-width:1200px;
margin:auto;
}

.movie{
background:#1f2937;
border-radius:8px;
overflow:hidden;
cursor:pointer;
transition:transform 0.2s;
}

.movie:hover{
transform:scale(1.05);
}

.movie img{
width:100%;
}

.movie h4{
padding:10px;
font-size:14px;
text-align:center;
}

footer{
text-align:center;
padding:20px;
font-size:12px;
color:#aaa;
}

</style>

</head>

<body>

<header>
🎬 Movies & Series
</header>

<div class="search-box">

<input id="searchInput" placeholder="Search movies or series...">
<button onclick="searchMovie()">Search</button>

</div>

<div class="player">

<iframe id="player"
src="https://vidsrc.to/embed/movie/tt4154796"
allowfullscreen>
</iframe>

</div>

<div class="movies" id="movies"></div>

<footer>
Movie data provided by TMDB
</footer>

<script>

const API_KEY="bf8178bc38b14afd2dbe7f66faa43ee5";

async function loadTrending(){

let res = await fetch(
`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}`
);

let data = await res.json();

displayMovies(data.results);

}

function displayMovies(movies){

let container=document.getElementById("movies");

container.innerHTML="";

movies.forEach(movie=>{

if(!movie.poster_path) return;

let title = movie.title || movie.name;

let poster = "https://image.tmdb.org/t/p/w500"+movie.poster_path;

let id = movie.id;

let type = movie.media_type || "movie";

let div=document.createElement("div");

div.className="movie";

div.innerHTML=`
<img src="${poster}">
<h4>${title}</h4>
`;

div.onclick=()=>playMovie(type,id);

container.appendChild(div);

});

}

function playMovie(type,id){

let url="";

if(type==="movie"){
url=`https://vidsrc.to/embed/movie/${id}`;
}else{
url=`https://vidsrc.to/embed/tv/${id}`;
}

document.getElementById("player").src=url;

window.scrollTo({top:0,behavior:"smooth"});

}

async function searchMovie(){

let query=document.getElementById("searchInput").value;

if(query.length<2) return;

let res=await fetch(
`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${query}`
);

let data=await res.json();

displayMovies(data.results);

}

loadTrending();

</script>

</body>
</html>
