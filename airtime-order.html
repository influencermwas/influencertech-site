<!DOCTYPE html>
<html>
<head>
<title>Buy Airtime</title>

<style>
body{
font-family:Arial;
background:#0f2027;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111827;
padding:30px;
border-radius:10px;
text-align:center;
width:320px;
}

input{
padding:10px;
margin-top:10px;
width:90%;
border-radius:5px;
border:none;
}

button{
padding:10px 20px;
margin-top:15px;
background:#22c55e;
border:none;
border-radius:5px;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Buy Airtime</h2>

<label>Till Name</label>
<input type="text" id="tillname">

<label>Receiving Number</label>
<input type="text" id="number">

<label>Amount Paid</label>
<input type="number" id="amount">

<label>To Receive</label>
<input type="text" id="receive" readonly>

<button onclick="confirmOrder()">Confirm Order</button>

</div>

<script>

/* calculator rate */
let rate = 90

/* calculator */
let amountInput = document.getElementById("amount")
let receiveInput = document.getElementById("receive")

amountInput.addEventListener("input", function(){

let amount = amountInput.value

if(amount === "" || amount <= 0){
receiveInput.value = ""
return
}

let airtime = amount / (rate/100)

receiveInput.value = Math.round(airtime)

})

function confirmOrder(){

alert("Order sent")

}

</script>

</body>
</html>
