<!DOCTYPE html>
<html>
<head>
<title>Buy Airtime</title>

<style>
body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:420px;
padding:20px;
box-sizing:border-box;
}

input{
width:100%;
padding:14px;
margin-top:6px;
margin-bottom:14px;
border-radius:8px;
border:none;
font-size:16px;
}

button{
padding:14px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.btn-group{
display:flex;
gap:10px;
margin-top:10px;
}

.copy-btn{
background:#2563eb;
color:white;
flex:1;
}

.confirm-btn{
background:#22c55e;
color:white;
flex:1;
}

.instructions{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:20px;
font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h2>Buy Airtime</h2>

<label>Till Name</label>
<input type="text" id="tillname">

<label>Receiving Number</label>
<input type="text" id="number">
<p id="stockDisplay" style="color:#4ade80;font-weight:bold;"></p>
<label>Amount Paid</label>
<input type="number" id="amount">

<label>To Receive</label>
<input type="text" id="receive" readonly>

<h3>M-Pesa Payment</h3>

<p><b>Till Number:</b> <span id="till">8396206</span></p>

<div class="btn-group">
<button class="copy-btn" onclick="copyTill()">Copy Till</button>
<button class="confirm-btn" onclick="confirmOrder()">Confirm Order</button>
</div>
<div class="instructions">

<b>How to Buy Airtime</b><br><br>

1️⃣ Go to <b>M-Pesa</b><br>
2️⃣ Select <b>Lipa na M-Pesa</b><br>
3️⃣ Choose <b>Buy Goods</b><br>
4️⃣ Enter Till Number <b>8396206</b><br>
5️⃣ Enter the amount shown above<br>
6️⃣ Complete payment then press <b>Confirm Order</b>

</div>

</div>

<script>
let availableStock = localStorage.getItem("airtime_stock") || 100000

document.getElementById("stockDisplay").innerText =
"Available Airtime: " + availableStock + " KES"
  fetch("settings.json")
.then(res => res.json())
.then(data => {

rate = data.rate

document.getElementById("stockDisplay").innerText =
"Available Airtime: " + data.stock + " KES"

})
/* Calculator rate */
let rate = localStorage.getItem("airtime_rate") || 90

let amountInput = document.getElementById("amount")
let receiveInput = document.getElementById("receive")

amountInput.addEventListener("input", function(){

let amount = amountInput.value

if(amount === "" || amount <= 0){
receiveInput.value = ""
return
}

let airtime = amount / (rate/100)

receiveInput.value = Math.round(airtime)

})

function copyTill(){

let till = document.getElementById("till").innerText
navigator.clipboard.writeText(till)

alert("Till number copied")

}

function confirmOrder(){

let tillname=document.getElementById("tillname").value
let number=document.getElementById("number").value
let amount=document.getElementById("amount").value
let airtime=document.getElementById("receive").value

if(!tillname || !number || !amount){
alert("Fill all fields")
return
}

let msg =
"NEW AIRTIME ORDER%0A"+
"Till Name: "+tillname+"%0A"+
"Receiving Number: "+number+"%0A"+
"Amount Paid: "+amount+"%0A"+
"Airtime: "+airtime

window.open("https://wa.me/254746975939?text="+msg)

}

</script>

</body>
</html>
