<!DOCTYPE html>
<html>
<head>
<title>Buy Airtime</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial;
background:#0f2027;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111827;
padding:30px;
border-radius:10px;
text-align:center;
width:320px;
}

input{
padding:10px;
margin-top:10px;
width:90%;
border-radius:5px;
border:none;
}

button{
padding:10px 20px;
margin-top:15px;
background:#22c55e;
border:none;
border-radius:5px;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Buy Airtime</h2>

<label>Till Name</label>
<input type="text" id="tillname">

<label>Receiving Number</label>
<input type="text" id="number">

<label>Amount Paid</label>
<input type="number" id="amount">

<label>To Receive</label>
<input type="text" id="receive" readonly>

<p>Till: <b>8396206</b></p>

<button onclick="confirmOrder()">Confirm Order</button>

</div>

<script>

const supabase = window.supabase.createClient(
"https://ihedsiltqrxbqwnouone.supabase.co",
"sb_publishable_2HLZ4B0X1atCHE_PBhXAmw_akGNlxlJ"
)

/* calculator rate */
let rate = 90

/* calculator */
let amountInput = document.getElementById("amount")
let receiveInput = document.getElementById("receive")

amountInput.addEventListener("input", function(){

let amount = amountInput.value

if(amount === "" || amount <= 0){
receiveInput.value = ""
return
}

let airtime = amount / (rate/100)

receiveInput.value = Math.round(airtime)

})

/* load real rate from Supabase */
async function loadRate(){

const { data } = await supabase
.from("settings")
.select("rate")
.eq("id",1)
.single()

if(data){
rate = data.rate
}

}

loadRate()

async function confirmOrder(){

let tillname=document.getElementById("tillname").value
let number=document.getElementById("number").value
let amount=document.getElementById("amount").value
let airtime=document.getElementById("receive").value

if(!tillname || !number || !amount){
alert("Fill all fields")
return
}

await supabase.from("orders").insert({
till_name:tillname,
receiving_number:number,
amount_paid:amount,
airtime_sent:airtime
})

let msg =
"NEW AIRTIME ORDER%0A"+
"Till Name: "+tillname+"%0A"+
"Receiving Number: "+number+"%0A"+
"Amount Paid: "+amount+"%0A"+
"Airtime: "+airtime

window.open("https://wa.me/254746975939?text="+msg)

}

</script>

</body>
</html>
