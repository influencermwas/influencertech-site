<!DOCTYPE html>
<html>
<head>
<title>Airtime Calculator</title>

<style>
body{
font-family:Arial;
background:#111827;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1f2937;
padding:30px;
border-radius:10px;
text-align:center;
}

input{
padding:10px;
margin:10px;
width:200px;
}
</style>

</head>

<body>

<div class="box">

<h2>Airtime Calculator</h2>

<input type="number" id="amount" placeholder="Amount Paid" oninput="calculate()">

<br>

<input type="text" id="receive" placeholder="To Receive" readonly>

</div>

<script>

let rate = 90

function calculate(){

let amount = document.getElementById("amount").value

if(amount == "" || amount <= 0){
document.getElementById("receive").value = ""
return
}

let airtime = amount / (rate/100)

document.getElementById("receive").value = Math.round(airtime)

}

</script>

</body>
</html>
